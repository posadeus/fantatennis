components:
  schemas:

    RankedPlayerDto:
      type: object
      properties:
        id:
          type: string
          default: 0
          description: Player's unique ID
        fullName:
          type: string
          default: ""
          description: Player's name
        rank:
          type: integer
          description: Player's ranking
        points:
          type: integer
          description: Player's points
      required:
        - id
        - fullName
        - rank
        - points

    TeamDto:
      type: object
      properties:
        owner:
          type: string
          default: ""
          description: The owner of the team
        players:
          $ref: '#/components/schemas/TeamPlayersDto'
        totalScore:
          type: double
          default: 0
          description: Total team's score
      required:
        - owner
        - players
        - totalScore

    TeamPlayersDto:
      type: array
      items:
        $ref: '#/components/schemas/TeamPlayerDto'

    TeamPlayerDto:
      type: object
      properties:
        fullName:
          type: string
          default: ""
          description: Player's full name
        fantaPoints:
          type: double
          default: 0
          description: Player's fanta-points
      required:
        - fullName
        - fantaPoints

    TeamCreatedDto:
      type: object
      properties:
        id:
          type: integer
          default: 0
          description: Team ID
        ownerId:
          type: string
          default: ""
          description: Team's Owner ID
      required:
        - id
        - ownerId

    TeamToCreateDto:
      type: object
      properties:
        ownerId:
          type: string
          default: ""
          example: OWNER_ID
        tournamentId:
          type: integer
          default: 0
      required:
        - ownerId
        - tournamentId

    PlayersToAddDto:
      type: object
      properties:
        playerIds:
          type: array
          default: [ ]
          items:
            type: string
          uniqueItems: true
        startingTournamentId:
          type: integer
          default: 0
          example: 1
      example:
        playerIds: [ "id1", "id2", "id3" ]
        startingTournamentId: 1
      required:
        - playerIds
        - startingTournamentId

    TournamentDto:
      type: object
      properties:
        teams:
          $ref: '#/components/schemas/TeamsDto'
      required:
        - teams

    TeamsDto:
      type: array
      items:
        type: object
        format: teamDto

    TournamentToCreateDto:
      type: object
      properties:
        startingTournamentId:
          type: integer
          example: 1
          default: 1
        endingTournamentId:
          type: integer
          example: 1
          default: 1
        tournamentYear:
          type: integer
          example: 2024
          default: 2024
      required:
        - startingTournamentId
        - endingTournamentId
        - tournamentYear

    TournamentCreatedDto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        startingTournamentId:
          type: integer
          example: 1
        endingTournamentId:
          type: integer
          example: 1
        tournamentYear:
          type: integer
          example: 2024
      required:
        - id
        - startingTournamentId
        - endingTournamentId
        - tournamentYear

    TournamentsDto:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer