openapi: 3.0.0
info:
  title: API to retrieve tennis players ranking
  version: 1.0.0
paths:
  /players/ranking/{positions}:
    get:
      operationId: players
      summary: Returns players ranking
      description: Returns an ordered list based on ranking.
      tags:
        - Ranking
      parameters:
        - in: path
          name: positions
          schema:
            type: integer
          required: true
          description: Number of ranking position you want to return.
      responses:
        '200':
          description: Ranking returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankedPlayer'
        '500':
          description: Error during the retrieving

components:
  schemas:
    RankedPlayer:
      type: object
      properties:
        id:
          type: string
          default: 0
          description: Player's unique ID
        fullName:
          type: string
          default: ""
          description: Player's name
        rank:
          type: integer
          description: Player's ranking
        points:
          type: integer
          description: Player's points
      required:
        - id
        - fullName
        - rank
        - points