openapi: 3.0.0
info:
  title: Team
  version: 1.0.0
paths:
  /team/{teamId}:
    get:
      operationId: team
      summary: Returns your team players
      description: Returns an ordered list based on your player points.
      tags:
        - Team
      parameters:
        - in: path
          name: teamId
          schema:
            type: string
          required: true
          description: ID of the team
      responses:
        '200':
          description: Team found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDto'
        '500':
          description: Error during team retrieval

components:
  schemas:
    TeamDto:
      type: object
      properties:
        players:
          $ref: '#/components/schemas/TeamPlayersDto'
        totalScore:
          type: double
          default: 0
          description: Total team's score
        completed:
          type: boolean
          default: false
          description: True if the team has the correct number of players
      required:
        - players
        - totalScore
        - completed

    TeamPlayersDto:
      type: array
      items:
        $ref: '#/components/schemas/TeamPlayerDto'

    TeamPlayerDto:
      type: object
      properties:
        fullName:
          type: string
          default: ""
          description: Player's full name
        fantaPoints:
          type: double
          default: 0
          description: Player's fanta-points
        playing:
          type: string
          description: Player's actual tournament played
        chosen:
          type: boolean
          default: false
          description: TRUE if player has been chosen for the tournament
      required:
        - fullName
        - fantaPoints
        - chosen