openapi: 3.0.0
info:
  title: Tournament
  version: 1.0.0
paths:
  /tournament/{tournamentId}:
    get:
      operationId: retrieve
      summary: Returns a Fanta Tournament by its ID
      description: Returns an ordered list based on your team points.
      tags:
        - Tournament
      parameters:
        - in: path
          name: tournamentId
          schema:
            type: integer
          required: true
          description: ID of the tournament
      responses:
        '200':
          description: Tournament found
          content:
            application/json:
              schema:
                $ref: './openApi-schemas.yml#/components/schemas/TournamentDto'
        '500':
          description: Error during tournament retrieval

  /tournament:
    post:
      operationId: create
      summary: Create a Fanta Tournament.
      description: Create an empty Tournament.
      tags:
        - Tournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './openApi-schemas.yml#/components/schemas/TournamentToCreateDto'
      responses:
        '201':
          description: Tournament created
          content:
            application/json:
              schema:
                $ref: './openApi-schemas.yml#/components/schemas/TournamentCreatedDto'
        '400':
          description: Wrong input body
        '500':
          description: Error during tournament retrieval